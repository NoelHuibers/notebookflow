name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node (biome + typecheck + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.4
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome check (lint + format)
        run: pnpm check

      - name: TypeScript typecheck
        run: pnpm typecheck

      - name: Vitest (graph-canvas)
        run: pnpm --filter @notebookflow/graph-canvas test

      - name: Vitest (app-core)
        run: pnpm --filter @notebookflow/app-core test

  python:
    name: Python (pytest + ruff + ty)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: engine/uv.lock

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync engine dependencies
        run: uv --project engine sync --all-extras --python ${{ matrix.python-version }}

      - name: Pytest
        working-directory: engine
        run: uv run pytest

      - name: Ruff
        working-directory: engine
        run: uv run ruff check .

      - name: ty (type check)
        working-directory: engine
        run: uv run ty check

  security:
    name: Security (audits + secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so gitleaks can scan every commit, not just HEAD.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.4
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ADVISORY ONLY (does not fail CI): still not clean after the 2026-07
      # deps sweep — 1 critical + 12 high remain, ALL transitive:
      # shell-quote via concurrently; brace-expansion via rimraf/glob and
      # @jupyterlab/builder; fast-uri via @jupyterlab/builder's ajv; ws via
      # @jupyterlab/services; vite/postcss via vitest and the vscode-extension
      # build; js-yaml via @tanstack/react-start. (better-auth was patched to
      # 1.6.22 — the only direct-dep finding.) Watch this step's log; flip
      # continue-on-error off once upstream releases clear the tree.
      - name: pnpm audit (NON-BLOCKING — check the log for high/critical)
        continue-on-error: true
        run: pnpm audit --audit-level high

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: engine/uv.lock

      # BLOCKING since the 2026-07 deps sweep: the lock is clean (idna 3.18,
      # pillow 12.3.0, starlette 1.3.1 validated against the full pytest
      # suite). A new advisory here should be fixed via
      # `uv lock --upgrade-package <name>` + tests, not by re-adding
      # continue-on-error.
      - name: pip-audit engine deps
        working-directory: engine
        run: |
          uv export --no-dev --no-emit-project --format requirements-txt -o /tmp/nbf-requirements.txt
          uv tool run pip-audit -r /tmp/nbf-requirements.txt --disable-pip

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
