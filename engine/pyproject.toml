[project]
name = "notebookflow-app"
version = "0.1.0"
description = "Visual pipeline editor and local execution engine for JupyterLab"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "NotebookFlow contributors" }]
keywords = ["jupyter", "jupyterlab", "notebook", "pipeline", "workflow"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Jupyter",
    "Framework :: Jupyter :: JupyterLab",
    "Framework :: Jupyter :: JupyterLab :: 4",
    "Framework :: Jupyter :: JupyterLab :: Extensions",
    "Framework :: Jupyter :: JupyterLab :: Extensions :: Prebuilt",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "fastapi>=0.139.2",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.51.0",
    "websockets>=16.0.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.1.1",
    "nbformat>=5.10.4",
    "pandas>=3.0.5",
    "matplotlib>=3.11.1",
    "pyarrow>=24.0.0",
    "watchfiles>=1.2.0",
    "croniter>=6.2.2",
    "anthropic>=0.100.0",
    "httpx>=0.28.1",
    # litellm 1.92+ ships manylinux-only wheels (new Rust bridge); Windows/macOS
    # dev installs would need a full Rust + MSVC toolchain to build from sdist.
    # Hold at the last universal-wheel line until upstream publishes win/mac wheels.
    "litellm>=1.91.4,<1.92",
    "pyjwt[crypto]>=2.10.1",
    "jupyterlab>=4.6.1,<5",
    "jupyter-server-proxy>=4.5,<5",
]

[project.urls]
Homepage = "https://notebookflow.app"
Repository = "https://github.com/NoelHuibers/notebookflow"
Issues = "https://github.com/NoelHuibers/notebookflow/issues"

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.22",
    "ty>=0.0.61",
]

[project.entry-points."notebookflow.nodes"]
# Built-in node packages register here. Third-party packages do the same in
# their own pyproject.toml so registry.py picks them up automatically.
builtin = "notebookflow.nodes:register"

[project.entry-points."jupyter_serverproxy_servers"]
# Lets jupyter-server-proxy auto-launch the engine when JupyterLab boots,
# so the JupyterLab adapter can connect via a relative /proxy/<port>/ws URL
# without the user having to run `notebookflow` in another terminal.
notebookflow = "notebookflow.proxy:server_proxy_config"

[project.scripts]
notebookflow = "notebookflow.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["notebookflow"]
exclude = ["notebookflow/labextension"]

[tool.hatch.build.targets.wheel.shared-data]
"notebookflow/labextension" = "share/jupyter/labextensions/@notebookflow/jupyterlab-extension"

[tool.hatch.build.targets.sdist]
include = ["notebookflow", "README.md", "LICENSE", "pyproject.toml"]
artifacts = ["notebookflow/labextension"]

[tool.ruff]
line-length = 100
target-version = "py311"  # lowest supported; ruff lints for the floor of requires-python

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
